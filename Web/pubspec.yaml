name: flixgo_web
description: Flutter web version of FlixGo Movie Streaming App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Material Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # Navigation & Routing
  go_router: ^12.1.3
  
  # Network & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Video Player
  video_player: ^2.8.1
  chewie: ^1.7.4
  
  # Image & Media
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  
  # Storage & Persistence
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utils & Helpers
  intl: ^0.19.0
  json_annotation: ^4.8.1
  uuid: ^4.2.1
  flutter_svg: ^2.0.9
  
  # Animations & UI
  animations: ^2.0.8
  lottie: ^2.7.0
  shimmer: ^3.0.0
  
  # Authentication & Security
  crypto: ^3.0.3
  
  # Payment Integration
  url_launcher: ^6.2.2
  webview_flutter: ^4.4.2
  
  # Responsive Design
  flutter_screenutil: ^5.9.0
  responsive_builder: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  fonts:
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
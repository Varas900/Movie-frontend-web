name: Varas

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # For project pages, Flutter needs the repo-name base href.
  # Example: /Movie-frontend-web/
  BASE_HREF: "/${{ github.event.repository.name }}/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: Web
        run: flutter pub get

      - name: Build web
        working-directory: Web
        run: flutter build web --release --base-href "${BASE_HREF}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Web/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
